# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/e_commerce_project
spring.datasource.username=root
spring.datasource.password=sabir2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port
server.port=8081

# JWT
jwt.secret=ecommerce-project-secret-key-for-jwt-token-generation-2026
jwt.expiration=86400000

# SMTP mail
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}
